name: Auto-Update DAS-LLM Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'src/das_llm/**'
      - 'security_invariants.yaml'
      - 'corpus/**'
      - 'examples/**'
  pull_request:
    paths:
      - 'src/das_llm/**'

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Generate & Update Live Documentation
        run: |
          das-llm docgen
      - name: Verify Documentation Artifacts
        run: |
          test -f docs/ARCHITECTURE.md
          test -f docs/INVARIANTS_SPEC.md
          test -f docs/API_REFERENCE.md
          test -f docs/index.html
          echo "✅ Documentation successfully compiled and verified!"
